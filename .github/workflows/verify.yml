name: Verify source candidate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_check:
        description: Enforce all publication readiness conditions
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  hygiene-and-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create pristine source snapshot and external working copy
        run: |
          mkdir "$RUNNER_TEMP/lev-source" "$RUNNER_TEMP/lev-work"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/lev-source"
          cp -R "$RUNNER_TEMP/lev-source/." "$RUNNER_TEMP/lev-work/"
      - name: Install reviewed credential scanner
        run: |
          curl --fail --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          cd "$RUNNER_TEMP"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Fresh installation and CPU tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m venv "$RUNNER_TEMP/lev-env"
          "$RUNNER_TEMP/lev-env/bin/python" -m pip install "$RUNNER_TEMP/lev-work[dev]"
          cd "$RUNNER_TEMP/lev-work"
          "$RUNNER_TEMP/lev-env/bin/python" -m pytest -q -p no:cacheprovider
      - name: Verify exact source artifact hygiene
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/lev-env/bin/python" "$RUNNER_TEMP/lev-source/scripts/verify_release.py" --root "$RUNNER_TEMP/lev-source" --mode hygiene --gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Redraw available aggregate figures externally
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/lev-env/bin/python" "$RUNNER_TEMP/lev-source/figures/reproduce.py" --output-dir "$RUNNER_TEMP/lev-figures"
      - name: Enforce publication readiness for release requests
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_check == true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/lev-env/bin/python" "$RUNNER_TEMP/lev-source/scripts/verify_release.py" --root "$RUNNER_TEMP/lev-source" --gitleaks "$RUNNER_TEMP/gitleaks"
